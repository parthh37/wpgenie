name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet ./...
      - name: test (incl. Caddyfile validation against real Caddy)
        run: go test -race -count=1 ./...
        env:
          WPGENIE_TEST_DOCKER: "1"
      - run: CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/wpgenie

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - name: build, and check the committed copy (internal/web/static/next) is current
        run: make ui-check

  postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: every store-backed test with the panel store on PostgreSQL
        run: make test-postgres

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make php-image
      - name: backups, staging, domains, PHP, SFTP, phpMyAdmin, page cache, images, insights and CDN links against real WordPress, MariaDB, Valkey and restic
        run: make test-e2e

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck deploy/install.sh
      - run: MARIADB_ROOT_PASSWORD=x CADDY_UID=999 CADDY_GID=999 docker compose -f deploy/docker-compose.yml config -q

  php-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t wpgenie/php:8.3 images/php
      - name: smoke test (hardened flags)
        run: |
          # Same layout site.prepareFiles creates: dir root:82 0750, docroot
          # 82:82. The image entrypoint's tar must own the docroot (it chmods
          # it), so a runner-owned 777 dir makes the container exit at once.
          sudo mkdir -p /tmp/s1/public
          sudo chown 0:82 /tmp/s1 && sudo chmod 0750 /tmp/s1
          sudo chown 82:82 /tmp/s1/public && sudo chmod 0755 /tmp/s1/public
          docker run -d --name php --user 82:82 --cap-drop ALL --security-opt no-new-privileges \
            --read-only --tmpfs /tmp:rw,noexec,nosuid --tmpfs /var/www/html:ro,noexec,nosuid,size=64k \
            -v /tmp/s1:/tmp/s1 -w /tmp/s1/public -e WPG_ROOT=/tmp/s1 -e WPG_MAX_CHILDREN=7 wpgenie/php:8.3 php-fpm
          # The entrypoint copies WordPress, then execs PHP-FPM: "ready" means both are done.
          for i in $(seq 1 60); do docker logs php 2>&1 | grep -q "ready to handle connections" && break; sleep 1; done
          docker logs php 2>&1 | grep -q "ready to handle connections"
          docker exec php test -f /tmp/s1/public/wp-includes/version.php
          docker exec php wp --version
          docker exec php php -l /usr/local/share/wpgenie/page-cache.php
          docker exec php php -l /usr/local/share/wpgenie/smtp.php
          docker exec php php -l /usr/local/share/wpgenie/profile.php
          for f in images image-convert convert-images cdn offload; do docker exec php php -l /usr/local/share/wpgenie/$f.php; done
          # The page cache stores Brotli copies; GD must write both modern formats.
          docker exec php php -r 'exit(function_exists("brotli_compress") && function_exists("imageavif") && function_exists("imagewebp") ? 0 : 1);'
          docker exec php grep -q "function wp_cache_init" /usr/local/share/wpgenie/object-cache.php
          # WPG_MAX_CHILDREN reaches the pool; the cron jail applies open_basedir.
          docker exec php php-fpm -tt 2>&1 | grep -q "pm.max_children = 7"
          docker exec -e PHP_INI_SCAN_DIR=:/usr/local/etc/php/jail.d php php -r 'exit(ini_get("open_basedir") === "/tmp/s1:/tmp:/usr/src/wordpress:/usr/local/share/wpgenie" ? 0 : 1);'
          # PHP errors go to the site's own log (the panel's insights read it).
          docker exec php php-fpm -tt 2>&1 | grep -q "php_value\[error_log\] = /tmp/s1/logs/php-error.log"
      - name: container logs
        if: failure()
        run: docker ps -a --filter name=php && docker logs php 2>&1 | tail -50

  caddy-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The Dockerfile checks the Coraza module is in; the test then runs the
      # rendered WAF config against request bodies in that image.
      - run: docker build -t wpgenie/caddy:test images/caddy
      - run: go test -count=1 -run WAF ./internal/proxy
        env:
          WPGENIE_TEST_DOCKER: "1"
