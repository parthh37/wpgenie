# WPGenie's Coraza settings, loaded after the CRS setup and before the rules.

# Bodies: inspect up to 12.5 MB (1 MB without files) and pass the rest
# uninspected rather than rejecting it: WordPress uploads and large posts
# must keep working. Response bodies aren't inspected (buffering every page
# costs latency and memory; the CRS response rules target other stacks).
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 1048576
SecRequestBodyLimitAction ProcessPartial
SecResponseBodyAccess Off

# CRS forbids the Expect header, which HTTP clients (curl, PHP, webhook
# senders) add to large POSTs. Caddy answers it itself; allow it.
SecAction "id:900250,phase:1,pass,t:none,nolog,setvar:'tx.restricted_headers_basic=/content-encoding/ /proxy/ /lock-token/ /content-range/ /if/ /x-http-method-override/ /x-http-method/ /x-method-override/ /x-middleware-subrequest/'"

# Matches go to a JSON audit log the daemon reads into the security log.
# Only the transaction summary and rule messages (parts A, H, Z): request
# headers and bodies would hold cookies and passwords.
SecAuditEngine RelevantOnly
SecAuditLogType Serial
SecAuditLogFormat JSON
SecAuditLogParts AHZ
SecAuditLogFileMode 0600
