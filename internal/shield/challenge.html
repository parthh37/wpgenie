<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Checking your browser…</title>
<style>
  :root { color-scheme: light dark; }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         background:Canvas; color:CanvasText; }
  main { max-width:28rem; padding:2rem; text-align:center; }
  h1 { font-size:1.25rem; margin:0 0 .5rem; }
  p { opacity:.75; margin:.25rem 0; }
  .bar { height:4px; border-radius:2px; background:color-mix(in srgb,CanvasText 12%,transparent);
         overflow:hidden; margin:1.5rem 0 .75rem; }
  .bar > i { display:block; height:100%; width:0; background:#3b82f6; transition:width .2s; }
  small { opacity:.5; }
</style>
</head>
<body>
<main>
  <h1>Verifying you are human</h1>
  <p>This takes a second and happens only once.</p>
  <div class="bar"><i id="progress"></i></div>
  <small>Protected by WPGenie Shield</small>
  <noscript><p><strong>Please enable JavaScript to continue.</strong></p></noscript>
  <form id="f" method="post" action="/_shield/verify" data-bits="{{.Difficulty}}">
    <input type="hidden" name="token" value="{{.Token}}">
    <input type="hidden" name="nonce" value="">
    <input type="hidden" name="return" value="{{.Return}}">
  </form>
</main>
<script>
(async () => {
  const f = document.getElementById('f');
  const bits = +f.dataset.bits, token = f.token.value, enc = new TextEncoder();
  const bar = document.getElementById('progress');
  const expected = 2 ** bits;
  const zeros = (b) => { let n = 0; for (const x of b) { if (x === 0) { n += 8; continue; } n += Math.clz32(x) - 24; break; } return n; };
  for (let n = 0; ; n++) {
    const h = new Uint8Array(await crypto.subtle.digest('SHA-256', enc.encode(token + ':' + n)));
    if (zeros(h) >= bits) { f.nonce.value = String(n); bar.style.width = '100%'; f.submit(); return; }
    if (n % 2048 === 0) bar.style.width = Math.min(95, 100 * n / expected) + '%';
  }
})();
</script>
</body>
</html>
