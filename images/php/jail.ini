; The web jail from pool.conf, for PHP run outside FPM on the site's behalf
; (WP-Cron). Loaded only when WPGenie sets PHP_INI_SCAN_DIR to include this
; directory, so WP-CLI maintenance commands are unaffected. Keep in sync.
open_basedir = ${WPG_ROOT}:/tmp:/usr/src/wordpress:/usr/local/share/wpgenie
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,show_source,dl
