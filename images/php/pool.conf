; WPGenie FPM pool overrides (loaded after the image's zz-docker.conf).
[global]
; WPGenie drains a replica with `docker stop` (SIGQUIT for this image): give
; in-flight requests up to 30s to finish instead of cutting them off.
process_control_timeout = 30s

[www]
; ondemand: idle sites cost ~0 workers, so one VPS can pack many small sites.
pm = ondemand
; Sized per container from its memory limit by WPGenie (runtime.FPMMaxChildren)
; so the workers can never outgrow the container and get OOM-killed.
pm.max_children = ${WPG_MAX_CHILDREN}
pm.process_idle_timeout = 30s
pm.max_requests = 500

request_terminate_timeout = 120s
catch_workers_output = yes
decorate_workers_output = no

; Security: applied to web requests only (FPM), so WP-CLI keeps working.
; open_basedir jails PHP to the site's own directory. Keep in sync with
; jail.ini, which applies the same jail to cron runs.
php_admin_value[open_basedir] = ${WPG_ROOT}:/tmp:/usr/src/wordpress:/usr/local/share/wpgenie
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,show_source,dl
php_admin_value[upload_tmp_dir] = /tmp
php_admin_value[session.save_path] = /tmp
php_admin_flag[allow_url_fopen] = on
